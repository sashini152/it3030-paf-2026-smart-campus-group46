spring:
  application:
    name: hub
  data:
    mongodb:
      # Default DB name appears in Compass as a database once documents exist.
      # Override: set env MONGODB_URI (e.g. Atlas connection string).
      uri: ${MONGODB_URI:mongodb://localhost:27017/smartcampus}
  main:
    allow-bean-definition-overriding: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 698958812390-85rb4i9ce3l95fcfrtkff7lh72dpei6e.apps.googleusercontent.com
            client-secret: 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
            redirect-uri: "http://localhost:8081/login/oauth2/code/google"
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

logging:
  level:
    org.springframework.security.oauth2: TRACE
    org.springframework.security.oauth2.client: TRACE
    org.springframework.security.oauth2.client.registration: TRACE
    com.smartcampus.hub: DEBUG

server:
  port: 8081
