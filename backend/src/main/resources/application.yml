spring:
  application:
    name: hub

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/smartcampus}
  main:
    allow-bean-definition-overriding: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:698958812390-85rb4i9ce3l95fcfrtkff7lh72dpei6e.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: email

logging:
  level:
    com.smartcampus.hub: DEBUG

server:
  port: 8081
